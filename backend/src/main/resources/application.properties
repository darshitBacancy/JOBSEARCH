spring.application.name=job-search-assistant
server.port=${SERVER_PORT:9091}

# ---------------------------------------------------------------
# Local secrets: GEMINI_API_KEY=... in backend/.env or the project-root .env (both gitignored)
# ---------------------------------------------------------------
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# ---------------------------------------------------------------
# LLM provider - Google Gemini via its OpenAI-compatible endpoint.
# (The "openrouter." prefix is historical; point base-url at https://openrouter.ai/api/v1 to use OpenRouter.)
# ---------------------------------------------------------------
openrouter.api-key=${GEMINI_API_KEY:${OPENROUTER_API_KEY:}}
openrouter.base-url=${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
openrouter.chat-model=${LLM_CHAT_MODEL:gemini-flash-latest}
# Tried in order when the primary model is rate-limited (429) or overloaded (503)
openrouter.fallback-chat-models=${LLM_FALLBACK_MODELS:gemini-3.5-flash,gemini-flash-lite-latest}
# low | medium | high - limits Gemini "thinking" so answers stay fast and fit in max-tokens
openrouter.reasoning-effort=low
openrouter.embedding-model=${LLM_EMBEDDING_MODEL:gemini-embedding-001}
openrouter.timeout-seconds=60
openrouter.temperature=0.4
openrouter.max-tokens=3000

# ---------------------------------------------------------------
# Relational store (jobs + conversation memory) - H2 file database
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./db/jobsearch;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------
# RAG pipeline
# ---------------------------------------------------------------
rag.jobs-data=classpath:data/jobs.json
# auto = Gemini embeddings when a key is configured (local fallback if that fails),
# openrouter = remote (Gemini/OpenRouter) only, local = offline hashing embedder
rag.embedding-provider=${RAG_EMBEDDING_PROVIDER:auto}
# The vector DB is in-memory. It is snapshotted to this file so restarts don't regenerate embeddings.
rag.vector-store-file=./db/vector-store.bin
rag.reindex-on-startup=${RAG_REINDEX_ON_STARTUP:false}
rag.chunk-max-chars=900
rag.embedding-batch-size=32
rag.retrieval-top-k=20
rag.max-jobs-returned=5
rag.candidate-pool-size=50
rag.history-window=8
rag.debug-enabled=true

# Relevance weights (re-normalised over the components that apply to a query)
rag.ranking.semantic=0.35
rag.ranking.skills=0.25
rag.ranking.experience=0.15
rag.ranking.location=0.10
rag.ranking.remote=0.05
rag.ranking.salary=0.10

logging.level.com.jobassistant=INFO
# Set to DEBUG to log the full RAG trace (query, criteria, chunks, context, answer) for every request
logging.level.com.jobassistant.rag.RagTraceStore=INFO
