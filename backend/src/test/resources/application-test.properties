# Isolated, offline test configuration
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
openrouter.api-key=
rag.embedding-provider=local
# no snapshot file: the vector store stays purely in memory during tests
rag.vector-store-file=
rag.index-async=false
rag.debug-enabled=true
logging.level.com.jobassistant=WARN
app.chat.mode=pipeline
